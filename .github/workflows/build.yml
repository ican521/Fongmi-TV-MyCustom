name: Build Fongmi Debug APK
on:
  push:
    branches: [ fongmi, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=debug.keystore" >> local.properties
          echo "keyAlias=androiddebugkey" >> local.properties
          echo "storePassword=android" >> local.properties

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run assembleMobileDebug
        run: ./gradlew assembleMobileDebug --stacktrace

      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: Fongmi-Debug-APK
          path: app/build/outputs/apk/mobile/debug/*.apk
