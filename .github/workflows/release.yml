name: Build Fongmi Release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签名（如 v5.6.3）'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python 3.10 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" || true

      - name: Prepare keystore & local.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run assembleMobileRelease
        run: ./gradlew assembleMobileRelease --stacktrace

      - name: Upload release apk (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Fongmi-Release-APK
          path: app/build/outputs/apk/mobile/release/*.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Fongmi Release ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/mobile/release/*.apk
